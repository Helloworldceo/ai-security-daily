name: Daily AI security digest

on:
  schedule:
    - cron: "17 1 * * *"   # every day 01:17 UTC (09:17 Beijing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's digest
        run: python scripts/fetch_digest.py
      - name: Commit
        run: |
          git config user.name "Dawit Abdisa"
          git config user.email "105408779+Helloworldceo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "digest: $(date -u +%F)"
          git push
